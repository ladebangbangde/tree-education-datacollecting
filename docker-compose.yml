services:
  image-recognition:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tree-education-datacollecting
    ports:
      - "18083:18083"
    env_file:
      - .env
    environment:
      OCR_ENGINE: ${OCR_ENGINE:-mock}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-recognition-token}
    networks:
      ioas-network:
        aliases:
          - tree-education-datacollecting
          - image-recognition
    restart: unless-stopped

networks:
  ioas-network:
    external: true
    name: tree-education-ioas_ioas-network
